<!DOCTYPE html><html lang=nl><head><meta charset=UTF-8><meta name=viewport content="width=device-width, initial-scale=1"><title>DDC testdemo — FICTIEF</title><style>:root{--navy:#0b1c2c;--blue:#1a6bb5;--sky:#e8f1f8;--line:#d5dee8;--ok:#1b7a4a;--okbg:#e7f6ee;--warnbg:#fff4d6;--muted:#5b6b7a}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,system-ui,sans-serif;background:#f4f7fa;color:var(--navy)}header{background:var(--navy);color:#fff;padding:14px 22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}header small{color:#9bb3c7}nav a{color:#d7e6f2;margin-left:10px;cursor:pointer}.wrap{max-width:1100px;margin:0 auto;padding:22px 16px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}@media(max-width:800px){.grid3{grid-template-columns:1fr}}.muted{color:var(--muted);line-height:1.5}button{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:10px 14px;font:inherit;cursor:pointer;margin:4px 6px 4px 0}button.sec{background:#e8eef4;color:var(--navy)}.banner{padding:10px 12px;border-radius:10px;margin-bottom:12px;font-size:13px;background:var(--warnbg)}.info{background:var(--sky)}label{display:block;font-size:12px;font-weight:650;margin:8px 0 4px}input{width:100%;padding:8px 10px;border:1px solid #c9d4df;border-radius:8px;font:inherit}.badge{font-size:11px;padding:3px 8px;border-radius:99px;background:var(--okbg);color:var(--ok);font-weight:700}.login{max-width:420px;margin:40px auto}</style></head><body><header><div><b>Dutch Drone Centre Aviolanda</b><br><small>Testdemo V0.1 · ALLES FICTIEF · webshop onaangeraakt</small></div><nav><a onclick="go('start')">Start</a><a onclick="go('klant')">Klant</a><a onclick="go('ddc')">DDC</a><a onclick="go('occ')">OCC</a></nav></header><div class=wrap id=app></div><script>const USERS={rick:{pass:'ddc-demo',rol:'ddc',naam:'Rick Maas'},rob:{pass:'ddc-demo',rol:'ddc',naam:'Rob Nispeling'},rudy:{pass:'ddc-demo',rol:'ddc',naam:'Rudy Muller'},robin:{pass:'ddc-demo',rol:'ddc',naam:'Robin Nelen'},occ:{pass:'occ-demo',rol:'occ',naam:'OCC / ASC'}};let route='start',sess=null,d={token:'DEMO-FICTIEF-DISNEY',status:'review',uitvoerder:'FICTIEF — Propwash UAS (Planes)',poc:'Mickey Mouse',tel:'06-00000000',dagen:'5 t/m 7 oktober 2026',godrone:'FICTIEF-GoDrone-Mickey',opdracht:'FICTIEF — Agrabah Flight Academy (Aladdin)'};function go(r){route=r;render()}function esc(s){return String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function render(){const el=document.getElementById('app');el.innerHTML=route==='klant'?viewKlant():route==='ddc'?viewGate('ddc'):route==='occ'?viewGate('occ'):viewStart()}function viewStart(){return '<div class=card><div class=banner><b>ALLES FICTIEF.</b> Disney- en Planes-personages: Mickey, Pluto, Aladdin, Bambi, Dusty Crophopper, Skipper Riley. Geen echte klant, geen echte vlucht. Webshop uAvionix blijft buiten.</div><h1>Drie ingangen, één dossier</h1><p class=muted>Klant vult in. DDC keurt goed. OCC ziet het dossier. Officiële Excel zit in de lokale zip.</p></div><div class=grid3><div class=card><h3>1. Klant</h3><p class=muted>Geen login.</p><p><button onclick="go(\'klant\')">Open klantlink</button></p></div><div class=card><h3>2. DDC</h3><p class=muted>rudy / rob / rick / robin<br>wachtwoord <b>ddc-demo</b></p><p><button onclick="go(\'ddc\')">Open DDC</button></p></div><div class=card><h3>3. OCC</h3><p class=muted>login <b>occ</b><br>wachtwoord <b>occ-demo</b></p><p><button onclick="go(\'occ\')">Open OCC</button></p></div></div>'}function viewKlant(){return '<div class=card><h1>Klantformulier (fictief)</h1><p class=muted>Status <span class=badge>'+esc(d.status)+'</span> · '+esc(d.token)+'</p><label>Uitvoerder</label><input id=uit value="'+esc(d.uitvoerder)+'"><label>POC</label><input id=poc value="'+esc(d.poc)+'"><label>Telefoon</label><input id=tel value="'+esc(d.tel)+'"><label>Testdagen</label><input id=dagen value="'+esc(d.dagen)+'"><p class=muted>Ook in het dossier: Pluto, Bambi, Dusty Crophopper, Skipper Riley — allemaal fictief.</p><p><button onclick=saveK()>Concept opslaan</button> <button onclick="d.status=\'review\';saveK();go(\'ddc\')">Indienen bij DDC</button></p></div>'}function saveK(){d.uitvoerder=document.getElementById('uit').value;d.poc=document.getElementById('poc').value;d.tel=document.getElementById('tel').value;d.dagen=document.getElementById('dagen').value;alert('Fictieve data opgeslagen in deze browser.')}function viewGate(need){if(!sess||sess.rol!==need){return '<div class="card login"><h2>'+(need==='ddc'?'DDC review':'OCC raadpleging')+'</h2><p class=muted>'+(need==='ddc'?'rudy / rob / rick / robin — ddc-demo':'occ — occ-demo')+'</p><label>Gebruikersnaam</label><input id=u><label>Wachtwoord</label><input id=p type=password><p><button onclick="login(\''+need+'\')">Inloggen</button></p></div>'}return '<div class=card><h1>'+(need==='ddc'?'DDC review':'OCC raadpleging')+'</h1><p>Ingelogd als <b>'+esc(sess.naam)+'</b> · '+esc(d.token)+' · <span class=badge>'+esc(d.status)+'</span> <button class=sec onclick="sess=null;render()">Uitloggen</button></p><div class="banner info">FICTIEF dossier. '+ (need==='occ'?'Read-only. Officiële Excel zit in de zip.':'Namen zijn tekenfilmfiguren.') +'</div><p><b>Uitvoerder</b> '+esc(d.uitvoerder)+'<br><b>POC</b> '+esc(d.poc)+' · '+esc(d.tel)+'<br><b>Opdracht</b> '+esc(d.opdracht)+'<br><b>Testdagen</b> '+esc(d.dagen)+'<br><b>GoDrone</b> '+esc(d.godrone)+'<br><b>Team</b> Mickey, Pluto, Aladdin, Bambi, Dusty, Skipper</p>'+(need==='ddc'?'<p><button onclick="d.status=\'goedgekeurd\';render()">Goedkeuren voor OCC</button> <button class=sec onclick="d.status=\'wijziging gevraagd\';render()">Terug naar klant</button></p>':'')+'</div>'}function login(need){const u=(document.getElementById('u').value||'').trim().toLowerCase();const p=document.getElementById('p').value;const acc=USERS[u];if(!acc||acc.pass!==p||acc.rol!==need){alert('Onbekende combinatie.');return}sess={user:u,...acc};render()}render()</script></body></html>
