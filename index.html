<!DOCTYPE html><html lang=nl><head><meta charset=UTF-8><meta name=viewport content="width=device-width, initial-scale=1"><title>DDC Aanvraagportaal testdemo</title><style>:root{--navy:#0b1c2c;--blue:#1a6bb5;--sky:#e8f1f8;--line:#d5dee8;--ok:#1b7a4a;--okbg:#e7f6ee;--warnbg:#fff4d6;--muted:#5b6b7a}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,system-ui,sans-serif;background:#f4f7fa;color:var(--navy)}header{background:var(--navy);color:#fff;padding:14px 22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}header small{color:#9bb3c7}nav a{color:#d7e6f2;margin-left:10px;cursor:pointer}.wrap{max-width:1100px;margin:0 auto;padding:22px 16px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}@media(max-width:800px){.grid3{grid-template-columns:1fr}}.muted{color:var(--muted);line-height:1.5}button{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:10px 14px;font:inherit;cursor:pointer;margin:4px 6px 4px 0}button.sec{background:#e8eef4;color:var(--navy)}.banner{padding:10px 12px;border-radius:10px;margin-bottom:12px;font-size:13px;background:var(--warnbg)}.info{background:var(--sky)}label{display:block;font-size:12px;font-weight:650;margin:8px 0 4px}input,textarea{width:100%;padding:8px 10px;border:1px solid #c9d4df;border-radius:8px;font:inherit}textarea{min-height:70px}.badge{font-size:11px;padding:3px 8px;border-radius:99px;background:var(--okbg);color:var(--ok);font-weight:700}.login{max-width:420px;margin:40px auto}.steps button{background:#e8eef4;color:var(--navy);font-size:13px}.steps button.on{background:var(--blue);color:#fff}.check{display:flex;align-items:center;gap:8px;margin:8px 0}.check input{width:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}</style></head><body><header><div><b>Dutch Drone Centre Aviolanda</b><br><small>Testdemo V0.1 · FICTIEF</small></div><nav><a onclick="go('start')">Start</a><a onclick="go('klant')">Klant</a><a onclick="go('ddc')">DDC</a><a onclick="go('occ')">OCC</a></nav></header><div class=wrap id=app></div><script>const USERS={rick:{pass:'ddc-demo',rol:'ddc',naam:'Rick Maas'},rob:{pass:'ddc-demo',rol:'ddc',naam:'Rob Nispeling'},rudy:{pass:'ddc-demo',rol:'ddc',naam:'Rudy Muller'},robin:{pass:'ddc-demo',rol:'ddc',naam:'Robin Nelen'},occ:{pass:'occ-demo',rol:'occ',naam:'OCC / ASC'}};const STAPPEN=['Organisatie','Testdagen','Personen','Toestellen','Programma','Indienen'];let route='start',sess=null,stap=0;const dossiers=[{token:'DEMO-2610-MICKEY',status:'review',uitvoerder:'Toontown Testflight B.V. (FICTIEF)',poc:'Mickey Mouse',tel:'06-00001111',mail:'mickey@fictief-demo.invalid',opdracht:'Agrabah Flight Academy (Aladdin)',dagen:'5 t/m 9 oktober 2026',start:'15:30',eind:'20:00',godrone:'FICTIEF-GoDrone-Mickey',crew:'Mickey Mouse (piloot), Pluto (technicus), Dusty Crophopper (piloot), Bambi (observer)',toestellen:'FPV-target + interceptor (fictief)',programma:'Opbouw en testdemo airside — geen echte intercept'},{token:'DDC-20260820-ALAD',status:'goedgekeurd',uitvoerder:'Lamp van Agrabah UAS (FICTIEF)',poc:'Aladdin',tel:'06-00003333',mail:'aladdin@fictief-demo.invalid',opdracht:'Sultan van Agrabah',dagen:'20-21 augustus 2026',start:'09:00',eind:'16:00',godrone:'FICTIEF-GoDrone-Aladdin',crew:'Aladdin, Abu',toestellen:'Tapijt-UAS (fictief)',programma:'Mapping-demo paleistuin'},{token:'DDC-20260714-PLAN',status:'afgerond',uitvoerder:'Planes Air Team (FICTIEF)',poc:'Dusty Crophopper',tel:'06-00004444',mail:'dusty@fictief-demo.invalid',opdracht:'Propwash Junction',dagen:'14 juli 2026',start:'08:00',eind:'18:00',godrone:'FICTIEF-GoDrone-Dusty',crew:'Dusty Crophopper, Skipper Riley',toestellen:'Air Tractor (fictief)',programma:'Oogstinspectie-demo'}];let d=dossiers[0];function go(r){route=r;render()}function esc(s){return String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function g(id,fb){const el=document.getElementById(id);return el?el.value:fb}function saveK(){d.uitvoerder=g('k_uit',d.uitvoerder);d.poc=g('k_poc',d.poc);d.tel=g('k_tel',d.tel);d.mail=g('k_mail',d.mail);d.opdracht=g('k_opd',d.opdracht);d.dagen=g('k_dagen',d.dagen);d.start=g('k_start',d.start);d.eind=g('k_eind',d.eind);d.godrone=g('k_gd',d.godrone);d.toestellen=g('k_toest',d.toestellen);d.programma=g('k_prog',d.programma)}function render(){const el=document.getElementById('app');el.innerHTML=route==='klant'?viewKlant():route==='ddc'?viewGate('ddc'):route==='occ'?viewGate('occ'):viewStart()}function viewStart(){return '<div class=card><div class=banner><b>ALLES FICTIEF.</b> Mickey, Pluto, Aladdin, Bambi, Dusty Crophopper, Skipper Riley. Geen echte klant.</div><h1>Drie ingangen, een dossier</h1><p class=muted>Klant vult het formulier stap voor stap in. DDC reviewt. OCC ziet het dossier.</p></div><div class=grid3><div class=card><h3>1. Klant</h3><p class=muted>Geen login. Hele formulier.</p><p><button onclick="go(\'klant\')">Open klantlink</button></p></div><div class=card><h3>2. DDC</h3><p class=muted>rudy / rob / rick / robin<br>wachtwoord <b>ddc-demo</b></p><p><button onclick="go(\'ddc\')">Open DDC</button></p></div><div class=card><h3>3. OCC</h3><p class=muted>login <b>occ</b><br>wachtwoord <b>occ-demo</b></p><p><button onclick="go(\'occ\')">Open OCC</button></p></div></div>'}function viewKlant(){const steps=STAPPEN.map(function(n,i){return '<button class="'+(i===stap?'on':'')+'" onclick="saveK();stap='+i+';render()">'+(i+1)+'. '+n+'</button>'}).join('');let body='';if(stap===0)body='<label>Uitvoerder</label><input id=k_uit value="'+esc(d.uitvoerder)+'"><label>POC</label><input id=k_poc value="'+esc(d.poc)+'"><label>Telefoon</label><input id=k_tel value="'+esc(d.tel)+'"><label>E-mail</label><input id=k_mail value="'+esc(d.mail)+'"><label>Opdrachtgever</label><input id=k_opd value="'+esc(d.opdracht)+'"><label>GoDrone</label><input id=k_gd value="'+esc(d.godrone)+'">';else if(stap===1)body='<label>Testdagen</label><input id=k_dagen value="'+esc(d.dagen)+'"><label>Start</label><input id=k_start value="'+esc(d.start)+'"><label>Einde</label><input id=k_eind value="'+esc(d.eind)+'">';else if(stap===2)body='<p><b>Crew (fictief)</b></p><p>'+esc(d.crew)+'</p><p class=muted>Mickey, Pluto, Dusty, Bambi, Aladdin — geen echte personen.</p>';else if(stap===3)body='<label>Toestellen</label><textarea id=k_toest>'+esc(d.toestellen)+'</textarea>';else if(stap===4)body='<label>Programma</label><textarea id=k_prog>'+esc(d.programma)+'</textarea>';else body='<div class="banner info">Klaar om in te dienen. '+esc(d.token)+' · '+esc(d.status)+'</div><p><b>'+esc(d.uitvoerder)+'</b><br>POC '+esc(d.poc)+' · '+esc(d.tel)+'<br>'+esc(d.dagen)+'</p><p><button onclick="saveK();d.status=\'review\';go(\'ddc\')">Indienen bij DDC</button></p>';return '<div class=card><div class=banner>Klantlink. Geen wachtwoord. Alles FICTIEF (Disney / Planes).</div><h1>Aanmeldformulier dronevluchten</h1><p class=muted>Status <span class=badge>'+esc(d.status)+'</span> · '+esc(d.token)+'</p><div class=steps>'+steps+'</div>'+body+'<p><button class=sec onclick="saveK();stap=Math.max(0,stap-1);render()">Vorige</button> <button onclick="saveK();stap=Math.min(5,stap+1);render()">Volgende</button> <button class=sec onclick="saveK();alert(\'Concept opgeslagen\')">Concept opslaan</button></p></div>'}function viewGate(need){if(!sess||sess.rol!==need){return '<div class="card login"><h2>'+(need==='ddc'?'DDC review':'OCC raadpleging')+'</h2><p class=muted>'+(need==='ddc'?'rudy / rob / rick / robin — ddc-demo':'occ — occ-demo')+'</p><label>Gebruikersnaam</label><input id=u><label>Wachtwoord</label><input id=p type=password><p><button onclick="login(\''+need+'\')">Inloggen</button></p></div>'}var list='<div class=card><h3>Archief (fictief)</h3><table><tr><th>Token</th><th>Uitvoerder</th><th>POC</th><th>Status</th></tr>'+dossiers.map(function(x){return '<tr><td>'+esc(x.token)+'</td><td>'+esc(x.uitvoerder)+'</td><td>'+esc(x.poc)+'</td><td><span class=badge>'+esc(x.status)+'</span></td></tr>'}).join('')+'</table></div>';var checks=need==='ddc'?'<div class=card><h3>Basischecks</h3><label class=check><input type=checkbox> GoDrone-id</label><label class=check><input type=checkbox> Testdagen</label><label class=check><input type=checkbox> Crew-lijst</label><p><button onclick="d.status=\'goedgekeurd\';render()">Goedkeuren voor OCC</button> <button class=sec onclick="d.status=\'wijziging gevraagd\';render()">Terug naar klant</button></p></div>':'';return list+'<div class=card><h1>'+(need==='ddc'?'DDC review':'OCC raadpleging')+'</h1><p>Ingelogd als <b>'+esc(sess.naam)+'</b> · '+esc(d.token)+' · <span class=badge>'+esc(d.status)+'</span> <button class=sec onclick="sess=null;render()">Uitloggen</button></p><div class="banner info">FICTIEF dossier. Officiële Excel zit in de zip, niet hier.</div><p><b>Uitvoerder</b> '+esc(d.uitvoerder)+'<br><b>POC</b> '+esc(d.poc)+' · '+esc(d.tel)+'<br><b>Opdracht</b> '+esc(d.opdracht)+'<br><b>Testdagen</b> '+esc(d.dagen)+'<br><b>Crew</b> '+esc(d.crew)+'<br><b>Toestellen</b> '+esc(d.toestellen)+'<br><b>Programma</b> '+esc(d.programma)+'</p></div>'+checks}function login(need){const u=(document.getElementById('u').value||'').trim().toLowerCase();const p=document.getElementById('p').value;const acc=USERS[u];if(!acc||acc.pass!==p||acc.rol!==need){alert('Onbekende combinatie.');return}sess={user:u,...acc};render()}render()</script></body></html>
